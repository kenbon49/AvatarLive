# SynLive 基础设施编排
#
# 默认起：srs / api / web / proxy。
# PostgreSQL 使用独立的 docker-compose.postgres.yml，必须先单独部署。
#
# 本地 Mac 无 Docker 时先忽略本文件；装好 Docker Desktop 后：
#   ./deploy-postgres.sh
#   ./deploy.sh
#   docker compose ps

name: synlive

services:
  # ===== SRS 媒体网关：仅视频预览/推流时需要，默认不启动（避免 8080 等端口冲突）=====
  # 启用：docker compose --profile media up -d srs
  srs:
    profiles: ["media"]
    image: ${REGISTRY}ossrs/srs:6
    restart: unless-stopped
    environment:
      CANDIDATE: ${SRS_CANDIDATE:-127.0.0.1}
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"   # RTMP 推流
      - "${SRS_HTTP_PORT:-18080}:8080"   # HTTP-FLV / HLS; 8080 is commonly occupied by another service
      - "${DATA_BIND_HOST:-127.0.0.1}:${SRS_API_PORT:-1985}:1985"      # HTTP API
      - "${SRS_WEBRTC_PORT:-8000}:8000/udp" # WebRTC
    volumes:
      - ./srs/conf/srs.conf:/usr/local/srs/conf/srs.conf
    command: ["./objs/srs", "-c", "conf/srs.conf"]

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY}
    restart: unless-stopped
    env_file:
      - ${AVATAR_ENV_FILE:-../.env}
    environment:
      # 覆盖为 docker 内网服务名
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-synlive}:${POSTGRES_PASSWORD:?Run deploy-postgres first}@postgres:5432/${POSTGRES_DB:-synlive}
      SRS_INTERNAL_RTMP_URL: ${SRS_INTERNAL_RTMP_URL:-rtmp://srs:1935/live}
      SRS_INTERNAL_API_URL: ${SRS_INTERNAL_API_URL:-http://srs:1985}
      SRS_PUBLIC_WHIP_PATH: ${SRS_PUBLIC_WHIP_PATH:-/rtc/v1/whip/}
      MEDIA_SUPERVISOR_ENABLED: ${MEDIA_SUPERVISOR_ENABLED:-true}
      LIVE_RUN_ALLOW_TEST_PATTERN: ${LIVE_RUN_ALLOW_TEST_PATTERN:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@avatarlive.app}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
    volumes:
      - api_runtime:/app/runtime
    ports:
      - "${DATA_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 20s
    networks:
      - default
      - database
  # ===== 前端（Next.js）=====
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        REGISTRY: ${REGISTRY}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        API_UPSTREAM: http://api:8000
        SRS_API_UPSTREAM: http://srs:1985
    environment:
      API_UPSTREAM: http://api:8000
      SRS_API_UPSTREAM: http://srs:1985
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_LINGMOU_TEMPLATE_ID: ${ALIYUN_LINGMOU_TEMPLATE_ID:-}
      ALIYUN_LINGMOU_REGION_ID: ${ALIYUN_LINGMOU_REGION_ID:-cn-beijing}
      ALIYUN_LINGMOU_ENDPOINT: ${ALIYUN_LINGMOU_ENDPOINT:-lingmou.cn-beijing.aliyuncs.com}
      ALIYUN_LINGMOU_TEXT_VARIABLE_NAME: ${ALIYUN_LINGMOU_TEXT_VARIABLE_NAME:-text}
      SEO_VOICE_API_BASE_URL: ${SEO_VOICE_API_BASE_URL:-http://host.docker.internal:8086}
      SEO_VOICE_API_KEY: ${SEO_VOICE_API_KEY:-}
      # Node 22 通过环境代理访问公网 API；未配置代理时保持直连。
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: host.docker.internal,localhost,127.0.0.1,${NO_PROXY:-${no_proxy:-}}
    volumes:
      - web_runtime:/app/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(4000), redirect: 'error'}).then((response) => { if (response.status !== 200) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ===== 单口反代（Caddy :8018）=====
  # 浏览器只访问 http://<主机>:8018；/api* /health* 转发后端，其余转发前端
  proxy:
    image: ${REGISTRY}caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${ACCESS_PORT:-8018}:8018"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

networks:
  database:
    name: ${POSTGRES_DOCKER_NETWORK:-synlive-database}
    external: true

volumes:
  api_runtime:
  web_runtime:
