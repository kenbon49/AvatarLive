# PostgreSQL is deployed independently from the application stack so database
# upgrades, backups, and restarts do not share the application lifecycle.
name: synlive-database

services:
  postgres:
    image: ${REGISTRY}postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synlive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-synlive}
    ports:
      - "${DATA_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synlive} -d ${POSTGRES_DB:-synlive}"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  default:
    name: ${POSTGRES_DOCKER_NETWORK:-synlive-database}

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-synlive_postgres_data}
